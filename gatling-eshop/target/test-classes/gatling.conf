# Gatling configuration file
gatling {
  core {
    outputDirectoryBaseName = "eshop-gatling-report"
    runDescription = "EShop Performance Test Execution"
    encoding = "utf-8"
  }
  charting {
    noReports = false
    maxPlotPerSeries = 1000
    indicators {
      lowerBound = 500      # OK threshold < 500ms
      higherBound = 1000    # KO threshold > 1000ms
      percentile1 = 50      # Median
      percentile2 = 75      # P75
      percentile3 = 95      # P95 (SLO < 500ms)
      percentile4 = 99      # P99
    }
  }
  http {
    warmUpUrl = "http://localhost:3000/api/products"
    enableGA = false
  }
}
